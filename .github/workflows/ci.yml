name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: pg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pg:pg@localhost:5432/pg_test
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test backend
        run: |
          if [ ! -f backend/package.json ]; then echo "No backend yet, skipping"; exit 0; fi
          cd backend
          npm ci
          npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test and build frontend
        run: |
          if [ ! -f frontend/package.json ]; then echo "No frontend yet, skipping"; exit 0; fi
          cd frontend
          npm ci
          npm test
          npm run build
